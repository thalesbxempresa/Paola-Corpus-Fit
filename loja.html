<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Loja | Paola Corpus Fit</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F6F0EA">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body data-pagina="loja">
  <div id="topo"></div>

  <main class="wrap">
    <header class="loja-topo">
      <span class="sobre">Loja Paola Corpus Fit</span>
      <h1 class="titulo">Combos, cintas e tratamento</h1>
    </header>
    <div class="filtros-barra"><nav class="filtros" id="filtros" aria-label="Categorias"></nav></div>
    <div class="loja-info">
      <span id="total-itens"></span>
      <label>Ordenar
        <select id="ordem">
          <option value="vendidos">Mais vendidos</option>
          <option value="menor">Menor preço</option>
          <option value="maior">Maior preço</option>
        </select>
      </label>
    </div>
    <div class="grade" id="grade-loja"></div>

    <section class="secao">
      <div class="praia-banner">
        <div>
          <span class="sobre">Lançamento · Verão</span>
          <h2 class="titulo">Moda praia Paola</h2>
          <p>Entre na lista de espera e veja a coleção primeiro.</p>
          <a class="btn btn-branco" href="moda-praia.html">Quero ser avisada</a>
        </div>
      </div>
    </section>
  </main>

  <div id="rodape"></div>
  <script src="js/dados.js"></script>
